<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community | Paradox Lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='40' cy='40' r='20' stroke='%23ff4336' stroke-width='3' fill='none'/><line x1='60' y1='60' x2='80' y2='80' stroke='%23ff4336' stroke-width='3'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <style>
    .community-container {
      min-height: 100vh;
      background: #0a0a0a;
      padding: 80px 0 40px;
      display: flex;
    }

    .community-sidebar {
      width: 280px;
      background: rgba(20, 20, 20, 0.8);
      border-right: 1px solid rgba(255, 67, 54, 0.1);
      padding: 30px 20px;
      overflow-y: auto;
      max-height: calc(100vh - 80px);
    }

    .sidebar-section {
      margin-bottom: 32px;
    }

    .sidebar-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff4336;
      margin-bottom: 12px;
      display: block;
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 16px;
    }

    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .channel-item {
      padding: 10px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
      border-left: 2px solid transparent;
    }

    .channel-item:hover {
      background: rgba(255, 67, 54, 0.1);
      color: #fff;
    }

    .channel-item.active {
      background: rgba(255, 67, 54, 0.15);
      color: #ff4336;
      border-left-color: #ff4336;
    }

    .channel-item::before {
      content: '#';
      font-weight: 700;
    }

    .active-members {
      background: rgba(255, 67, 54, 0.05);
      border: 1px solid rgba(255, 67, 54, 0.2);
      border-radius: 4px;
      padding: 16px;
      text-align: center;
    }

    .active-members-label {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 8px;
    }

    .active-members-count {
      font-size: 32px;
      font-weight: 900;
      color: #ff4336;
      margin-bottom: 8px;
    }

    .active-members-text {
      font-size: 14px;
      color: #fff;
    }

    .community-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, rgba(255, 67, 54, 0.02) 0%, rgba(30, 30, 30, 0) 100%);
    }

    .community-header {
      background: rgba(20, 20, 20, 0.8);
      border-bottom: 1px solid rgba(255, 67, 54, 0.1);
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .channel-header {
      flex: 1;
    }

    .channel-header h2 {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      margin: 0;
    }

    .channel-header p {
      font-size: 14px;
      color: #aaa;
      margin: 4px 0 0;
    }

    .user-info {
      text-align: right;
    }

    .user-info p {
      font-size: 14px;
      color: #aaa;
      margin: 0 0 4px;
    }

    .user-email {
      font-size: 16px;
      font-weight: 600;
      color: #ff4336;
      margin: 0;
    }

    .logout-btn {
      background: rgba(255, 67, 54, 0.1);
      border: 1px solid rgba(255, 67, 54, 0.3);
      color: #ff4336;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 8px;
      transition: all 0.3s;
    }

    .logout-btn:hover {
      background: rgba(255, 67, 54, 0.2);
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 30px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      animation: slideIn 0.3s ease-out;
      max-width: 85%;
    }

    .message.user {
      align-items: flex-end;
    }

    .message.user .message-content {
      background: rgba(255, 67, 54, 0.18);
      border-color: #ff4336;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-avatar {
      display: none;
    }

    .message-content {
      background: rgba(255, 67, 54, 0.08);
      border: 1px solid rgba(255, 67, 54, 0.16);
      border-radius: 18px 18px 18px 4px;
      padding: 14px 16px;
      max-width: 100%;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .message-name {
      font-weight: 600;
      color: #fff;
      font-size: 14px;
    }

    .message-name.author {
      color: #ff4336;
    }

    .message-time {
      font-size: 12px;
      color: #777;
    }

    .message-text {
      color: #ddd;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .input-area {
      background: rgba(20, 20, 20, 0.8);
      border-top: 1px solid rgba(255, 67, 54, 0.1);
      padding: 20px 40px;
      display: flex;
      gap: 12px;
    }

    .message-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 67, 54, 0.2);
      border-radius: 4px;
      padding: 12px 16px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: all 0.3s;
    }

    .message-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .message-input:focus {
      outline: none;
      border-color: #ff4336;
      background: rgba(255, 67, 54, 0.05);
    }

    .send-btn {
      background: #ff4336;
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: #f44336;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 67, 54, 0.3);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      color: #aaa;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 16px;
      margin: 0;
    }

    .case-files-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 67, 54, 0.1);
    }

    .case-files-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff4336;
      margin-bottom: 12px;
      display: block;
    }

    .case-files-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 16px;
    }

    .case-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      padding: 0 20px;
    }

    .case-item {
      background: rgba(255, 67, 54, 0.1);
      border: 1px solid rgba(255, 67, 54, 0.2);
      border-radius: 4px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      color: #aaa;
      font-size: 13px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .case-item:hover {
      background: rgba(255, 67, 54, 0.2);
      border-color: #ff4336;
      color: #ff4336;
      transform: translateY(-2px);
    }

    .auth-error {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0a0a0a;
      flex-direction: column;
      color: #aaa;
    }

    .auth-error h2 {
      font-size: 24px;
      color: #ff4336;
      margin-bottom: 16px;
    }

    .auth-error a {
      color: #ff4336;
      text-decoration: none;
      font-weight: 600;
      margin-top: 16px;
    }

    @media (max-width: 768px) {
      .community-container {
        flex-direction: column;
      }

      .community-sidebar {
        width: 100%;
        max-height: 200px;
        border-right: none;
        border-bottom: 1px solid rgba(255, 67, 54, 0.1);
        display: flex;
        gap: 30px;
        overflow-x: auto;
        padding: 20px;
      }

      .sidebar-section {
        margin-bottom: 0;
        flex-shrink: 0;
      }

      .community-header {
        flex-direction: column;
        gap: 16px;
        text-align: left;
      }

      .user-info {
        text-align: left;
      }

      .messages-container,
      .input-area {
        padding: 20px;
      }

      .case-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }
    }
  </style>
</head>
<body>

<header class="navbar">
  <div class="logo-container">
    <img src="Logo.png" alt="Paradox Lab Logo" class="logo-img">
    <div class="logo">PARADOX</div>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="explore.html">Explore</a>
    <a href="activities.html">Activities</a>
    <a class="active">Community</a>
    <a href="join.html">Join</a>
  </nav>
</header>

<div class="community-container">
  <!-- Sidebar -->
  <aside class="community-sidebar">
    <div class="sidebar-section">
      <span class="sidebar-label">CHANNELS</span>
      <h3 class="sidebar-title">General</h3>
      <div class="channel-list">
        <div class="channel-item active" data-channel="general">#general</div>
        <div class="channel-item" data-channel="investigations">#investigations</div>
        <div class="channel-item" data-channel="announcements">#announcements</div>
        <div class="channel-item" data-channel="resources">#resources</div>
        <div class="channel-item" data-channel="off-topic">#off-topic</div>
      </div>
    </div>

    <div class="sidebar-section">
      <span class="sidebar-label">STATUS</span>
      <div class="active-members">
        <div class="active-members-label">Active Members</div>
        <div class="active-members-count" id="memberCount">0</div>
        <div class="active-members-text" id="memberText">online</div>
      </div>
    </div>

    <!-- Case Files Section -->
    <div class="sidebar-section case-files-section">
      <span class="sidebar-label">INVESTIGATIONS</span>
      <h3 class="case-files-title">Active Cases</h3>
      <div class="case-grid" id="caseList"></div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="community-main">
    <!-- Header -->
    <div class="community-header">
      <div class="channel-header">
        <h2 id="channelName">#general</h2>
        <p id="channelDesc">General discussion</p>
      </div>
      <div class="user-info">
        <p>Logged in as</p>
        <p class="user-email" id="userEmail"></p>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
      <div class="messages-container" id="messagesContainer">
        <div class="empty-state">
          <div class="empty-state-icon">💬</div>
          <p>No messages yet. Start the conversation!</p>
        </div>
      </div>

      <div class="input-area">
        <input type="text" class="message-input" id="messageInput" placeholder="Press Enter to send a message...">
        <button class="send-btn" onclick="sendMessage()">→</button>
      </div>
    </div>
  </main>
</div>

<script>
  const storedEmail = localStorage.getItem('userEmail');
  const userEmail = storedEmail || 'Guest User';
  document.getElementById('userEmail').textContent = storedEmail ? userEmail : 'Guest User';

  const chatBuckets = {
    general: [],
    investigations: [],
    announcements: [],
    resources: [],
    'off-topic': []
  };

  let currentChannel = 'general';

  const channelDescriptions = {
    general: 'General discussion',
    investigations: 'Active cases and investigations',
    announcements: 'Important announcements',
    resources: 'Shared materials',
    'off-topic': 'Casual chat'
  };

  document.querySelectorAll('.channel-item').forEach(item => {
    item.addEventListener('click', () => switchChannel(item.dataset.channel));
  });

  function switchChannel(channel) {
    currentChannel = channel;

    document.querySelectorAll('.channel-item').forEach(item => {
      item.classList.toggle('active', item.dataset.channel === channel);
    });

    document.getElementById('channelName').textContent = `#${channel}`;
    document.getElementById('channelDesc').textContent = channelDescriptions[channel] || '';
    displayMessages(chatBuckets[channel]);
  }

  function addMessageToUI(message) {
    const container = document.getElementById('messagesContainer');
    const emptyState = container.querySelector('.empty-state');
    if (emptyState) emptyState.remove();

    const messageEl = document.createElement('div');
    messageEl.className = `message ${message.own ? 'user' : ''}`.trim();

    const time = new Date(message.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    messageEl.innerHTML = `
      <div class="message-content">
        <div class="message-header">
          <span class="message-name">${escapeHtml(message.name)}</span>
          <span class="message-time">${time}</span>
        </div>
        <div class="message-text">${escapeHtml(message.text)}</div>
      </div>
    `;

    container.appendChild(messageEl);
    container.scrollTop = container.scrollHeight;
  }

  function displayMessages(messages) {
    const container = document.getElementById('messagesContainer');
    container.innerHTML = '';

    if (!messages || messages.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">💬</div>
          <p>No messages yet. Start the conversation!</p>
        </div>
      `;
      return;
    }

    messages.forEach(msg => addMessageToUI(msg));
    container.scrollTop = container.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;

    const message = {
      name: userEmail,
      text,
      time: new Date().toISOString(),
      own: true
    };

    chatBuckets[currentChannel].push(message);
    addMessageToUI(message);
    input.value = '';
    input.focus();
  }

  document.getElementById('messageInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function logout() {
    localStorage.removeItem('userEmail');
    window.location.href = 'join.html';
  }

  const cases = [
    'antikythera', 'bermuda', 'crispr', 'dark-matter', 'entanglement',
    'fermi', 'godel', 'riemann', 'simulation', 'theseus', 'trolley', 'voynich'
  ];

  const caseList = document.getElementById('caseList');
  cases.forEach(caseFile => {
    const caseItem = document.createElement('a');
    caseItem.href = `cases/${caseFile}.html`;
    caseItem.className = 'case-item';
    caseItem.textContent = caseFile;
    caseList.appendChild(caseItem);
  });

  switchChannel('general');
</script>

</body>
</html>
